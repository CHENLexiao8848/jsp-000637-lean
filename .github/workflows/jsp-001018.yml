name: JSP-001018 Lean verification

on:
  push:
    branches: [codex/jsp-001018-proof]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEAN_NUM_THREADS: 2
    defaults:
      run:
        working-directory: proofs/JSP-001018
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: proofs/JSP-001018
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"
      - name: Build, audit axioms, and replay proof module
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jsp-001018-verification
          path: proofs/JSP-001018/evidence/
          retention-days: 90
