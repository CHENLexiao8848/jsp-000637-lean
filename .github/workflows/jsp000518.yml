name: JSP000518 complete proof
on:
  push:
    branches: [codex/jsp-000518-proof]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: 2
    defaults:
      run:
        working-directory: proofs/jsp-000518
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: |
          curl --proto "=https" --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download pinned dependency cache
        run: lake exe cache get
      - name: Build and audit complete proof
        run: python3 verify.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jsp000518-verification
          path: proofs/jsp-000518/verification-output/
          retention-days: 90
